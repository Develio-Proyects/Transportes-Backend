services:

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PROD_PASSWORD}
      POSTGRES_DB: transportes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: tobiasriccone/backend-transportes:latest
    container_name: backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PROD_DB_URL: ${DB_PROD_URL}
      DB_PROD_PASSWORD: ${DB_PROD_PASSWORD}
      FRONT_URL: ${FRONT_URL}
      API_URL: ${API_URL}
    ports:
      - "8080:8080"
    volumes:
      - ./images:/images

  frontend:
    image: tobiasriccone/frontend-transportes:latest
    container_name: frontend
    restart: always

volumes:
  postgres-data: